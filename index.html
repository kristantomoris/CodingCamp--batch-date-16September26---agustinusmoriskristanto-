<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- Header & Balance -->
    <header class="header">
      <h1>Expense Tracker</h1>
      <div class="balance-card">
        <span class="balance-label">Total Balance</span>
        <span class="balance-amount" id="total-balance">$0.00</span>
      </div>
    </header>

    <main class="main">

      <!-- Left Column: Form + Transaction List -->
      <section class="left-panel">

        <!-- Input Form -->
        <div class="card">
          <h2>Add Transaction</h2>
          <form id="transaction-form" novalidate>

            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input
                type="text"
                id="item-name"
                placeholder="e.g. Lunch, Bus ticket…"
                autocomplete="off"
              />
              <span class="error-msg" id="error-name"></span>
            </div>

            <div class="form-group">
              <label for="amount">Amount ($)</label>
              <input
                type="number"
                id="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
              />
              <span class="error-msg" id="error-amount"></span>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category">
                <option value="">-- Select category --</option>
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚌 Transport</option>
                <option value="Fun">🎉 Fun</option>
              </select>
              <span class="error-msg" id="error-category"></span>
            </div>

            <button type="submit" class="btn-add">Add Transaction</button>
          </form>
        </div>

        <!-- Transaction List -->
        <div class="card">
          <h2>Transactions <span class="count-badge" id="count-badge">0</span></h2>
          <div class="transaction-list-wrapper">
            <ul class="transaction-list" id="transaction-list">
              <li class="empty-state" id="empty-state">
                No transactions yet. Add one above!
              </li>
            </ul>
          </div>
        </div>

      </section>

      <!-- Right Column: Pie Chart -->
      <section class="right-panel">
        <div class="card chart-card">
          <h2>Spending by Category</h2>
          <div class="chart-wrapper" id="chart-wrapper">
            <canvas id="spending-chart"></canvas>
            <p class="chart-empty" id="chart-empty">Add transactions to see the chart.</p>
          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
